[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-os"
version = "1.0.0"
description = "AI-powered self-healing Linux observability dashboard"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "PyQt6",
    "pyqtgraph",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
shos = "self_healing_os.launcher:main"

[tool.setuptools.packages.find]
include = ["self_healing_os*"]
